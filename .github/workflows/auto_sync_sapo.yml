name: Auto Sync Black Friday & Sapo 5 Kho

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: havana-sale-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-stock-and-media:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check actor to prevent bot loop
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.actor }}" = "github-actions[bot]" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unpack Media & Real-Time Sync Sapo 5 Warehouses
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAPO_DOMAIN: havanago.mysapogo.com
          SAPO_COOKIE: ${{ secrets.SAPO_COOKIE }}
          SAPO_ACCESS_TOKEN: ${{ secrets.SAPO_ACCESS_TOKEN }}
        run: python auto_sync_sapo.py

      - name: Commit & Deploy to Cloudflare Pages (Smart Quota Guard)
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -f ".skip_git_commit" ]; then
            rm -f .skip_git_commit
            echo "Da cap nhat Live Stock Feed tuc thi (khong can tao commit moi tren main)."
            exit 0
          fi
          rm -f .skip_git_commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Khong co thay doi moi tren nhanh main."
          else
            git commit -m "chore(auto): dong bo ton 5 kho Sapo & anh moi"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
