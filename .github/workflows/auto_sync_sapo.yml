name: Auto Sync Black Friday & Sapo 5 Kho

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-stock:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl -q

      - name: Unpack Media & Sync Sapo 5 Warehouses
        env:
          SAPO_DOMAIN: havanago.mysapogo.com
          SAPO_ACCESS_TOKEN: ${{ secrets.SAPO_ACCESS_TOKEN }}
          SAPO_COOKIE: ${{ secrets.SAPO_COOKIE }}
        run: python auto_sync_sapo.py

      - name: Commit & Deploy to Cloudflare Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Khong co thay doi moi."
          else
            git commit -m "chore(auto): cap nhat ton 5 kho Sapo & media"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
